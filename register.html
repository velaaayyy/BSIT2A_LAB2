<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, #00e5ff15, transparent 30%),
        radial-gradient(circle at 80% 80%, #8b5cf615, transparent 30%),
        #07090d;
      padding: 20px;
    }

    .register-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(15, 18, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 50px rgba(0, 229, 255, 0.06),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    }

    .logo {
      width: 42px;
      height: 42px;
      margin-bottom: 28px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00e5ff, #7c3aed);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #858b98;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b7bdc9;
      font-size: 13px;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: 0.25s ease;
    }

    input::placeholder {
      color: #555b67;
    }

    input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.08);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #6f7785;
      cursor: pointer;
      font-size: 12px;
    }

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 8px 0 22px;
      color: #777f8d;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      accent-color: #00e5ff;
    }

    .terms a,
    .login a {
      color: #00d9ff;
      text-decoration: none;
    }

    .register-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      color: #020609;
      background: linear-gradient(135deg, #00e5ff, #8b5cf6);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.12);
    }

    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 229, 255, 0.2);
    }

    .login {
      margin-top: 24px;
      text-align: center;
      color: #777f8d;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .register-card {
        padding: 30px 24px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="register-card">

    <div class="logo"></div>

    <h1>Create account</h1>
    <p class="subtitle">Join us and get started in seconds.</p>

    <form id="registerForm">

      <div class="field">
        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          placeholder="Alex Morgan"
          required
        />
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="alex@example.com"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            minlength="8"
            required
          />

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('password', this)"
          >
            SHOW
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            minlength="8"
            required
          />

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirmPassword', this)"
          >
            SHOW
          </button>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" required />
        <span>
          I agree to the
          <a href="#">Terms of Service</a>
          and
          <a href="#">Privacy Policy</a>.
        </span>
      </label>

      <button class="register-btn" type="submit">
        CREATE ACCOUNT
      </button>

    </form>

    <p class="login">
      Already have an account?
      <a href="#">Log in</a>
    </p>

  </main>

  <script>
    function togglePassword(id, button) {
      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "HIDE";
      } else {
        input.type = "password";
        button.textContent = "SHOW";
      }
    }

    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      alert("Account created successfully!");
    });
  </script>

</body>
</html>
